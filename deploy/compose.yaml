# Production: everything ReturnMate needs on one machine (an Oracle Cloud Always Free VM).
#
#   internet ──443──▶ web (Caddy: HTTPS, the React UI, /api → api)
#                          │ frontend network
#                         api (Spring Boot)
#                          │ backend network (internal: no internet, no published ports)
#                         db (Postgres)
#
# Secrets come from deploy/.env (created by ./init-env.sh, never committed).
# Start/update:  docker compose up -d --build

name: returnmate

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: returnmate
      POSTGRES_USER: returnmate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./init-env.sh first}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnmate -d returnmate"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build: ../backend/returnmate-core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/returnmate
      DB_USERNAME: returnmate
      DB_PASSWORD: ${DB_PASSWORD:?run ./init-env.sh first}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?run ./init-env.sh first}
      TOKEN_KEK_BASE64: ${TOKEN_KEK_BASE64:?run ./init-env.sh first}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JPA_SHOW_SQL: "false"
      MANAGEMENT_ENDPOINTS: health
      # Heap = this % of mem_limit. The rest is for the JVM's own memory (classes, threads).
      # On a 1 GB VM, set in .env: API_MEM_LIMIT=512m and API_JAVA_OPTS=-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError
      JAVA_TOOL_OPTIONS: ${API_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    mem_limit: ${API_MEM_LIMIT:-1g}
    # On the frontend network so Caddy can reach it; that network also gives it internet
    # access (needed to fetch Google's sign-in keys).
    networks: [backend, frontend]

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?run ./init-env.sh first}
    volumes:
      - caddy_data:/data # the HTTPS certificate lives here; keep it so restarts don't re-request one
      - caddy_config:/config
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  caddy_data:
  caddy_config:

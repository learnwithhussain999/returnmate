services:
  postgres:
    image: postgres:17
    container_name: returnmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: returnmate
      POSTGRES_USER: returnmate_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - returnmate_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnmate_user -d returnmate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  returnmate_data:


server:
  port: 8080

spring:
  application:
    name: returnmate-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/returnmate}
    username: ${DB_USERNAME:returnmate_user}
    password: ${DB_PASSWORD:local_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET_BASE64}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  crypto:
    # Master key for encrypting mailbox tokens. Generate with: openssl rand -base64 32
    current-key-id: ${TOKEN_KEK_ID:k1}
    keys:
      k1: ${TOKEN_KEK_BASE64:}

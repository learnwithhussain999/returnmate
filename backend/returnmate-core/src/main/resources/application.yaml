
server:
  port: 8080

spring:
  application:
    name: returnmate-core

  datasource:
    url: jdbc:postgresql://localhost:5432/returnmate
    username: returnmate_user
    password: local_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


server:
  port: 8080

spring:
  application:
    name: returnmate-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/returnmate}
    username: ${DB_USERNAME:returnmate_user}
    password: ${DB_PASSWORD:local_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings
  endpoint:
    health:
      show-details: when_authorized

# TEMPLATE ONLY. Never commit real values.
#
# Kubernetes Secrets are only base64-encoded, not encrypted, so a secret in git is a
# leaked secret. Create the real one straight from the command line instead:
#
#   kubectl -n returnmate create secret generic returnmate-core-secrets \
#     --from-literal=DB_URL='jdbc:postgresql://<host>:5432/<db>?sslmode=require' \
#     --from-literal=DB_USERNAME='<user>' \
#     --from-literal=DB_PASSWORD='<password>' \
#     --from-literal=JWT_SECRET_BASE64="$(openssl rand -base64 48)" \
#     --from-literal=TOKEN_KEK_BASE64="$(openssl rand -base64 32)"
#
# Keep a copy of JWT_SECRET_BASE64 and TOKEN_KEK_BASE64 somewhere safe (a password
# manager). If TOKEN_KEK_BASE64 is lost, stored mailbox tokens can never be decrypted.
#
# Later improvement: keep these in Google Secret Manager and sync them into the cluster,
# so nobody needs to handle them on a laptop.
apiVersion: v1
kind: Secret
metadata:
  name: returnmate-core-secrets
  namespace: returnmate
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://HOST:5432/DB?sslmode=require"
  DB_USERNAME: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  JWT_SECRET_BASE64: "CHANGE_ME"
  TOKEN_KEK_BASE64: "CHANGE_ME"
